<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Calidad B10-Carrocerías</title>
<style>
  :root{
    --bg: #0a1420;
    --panel: #10202f;
    --panel2: #16293b;
    --line: #234055;
    --text: #eaf2f5;
    --muted: #7fa0b0;
    --accent: #17c39b;
    --accent-dim: #0f3d34;
    --ok: #2fae66;
    --danger: #e5484d;
    --brandbar: #071019;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display:flex; flex-direction:column; min-height:100vh;
  }
  header{
    background:var(--panel); border-bottom:1px solid var(--line);
    padding:10px 14px; display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:20;
  }
  .brandbar{
    background:var(--brandbar); padding:10px 14px; display:flex; align-items:center; gap:10px;
    border-bottom:1px solid var(--line);
  }
  .brandmark{
    width:30px; height:30px; border-radius:7px; flex-shrink:0;
    background:linear-gradient(135deg, var(--accent), #0a7a61);
    display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:13px; color:#04120e; letter-spacing:-0.5px;
  }
  .brandtext{ line-height:1.15; }
  .brandtext .l1{ font-size:13px; font-weight:800; letter-spacing:1.2px; color:var(--text); }
  .brandtext .l2{ font-size:10.5px; font-weight:600; letter-spacing:0.6px; color:var(--muted); text-transform:uppercase; }
  .hero-banner{
    position:relative; border-radius:20px; overflow:hidden; margin-bottom:16px;
    background: radial-gradient(120% 140% at 30% 20%, #22348f 0%, #101c52 45%, #070b28 100%);
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    padding:18px 16px 16px;
  }
  .hero-banner .eyebrow{
    font-size:11px; font-weight:800; letter-spacing:2px; color:rgba(255,255,255,0.65);
    text-transform:uppercase; margin-bottom:2px;
  }
  .hero-banner .qc-line{
    font-size:11px; font-weight:700; letter-spacing:0.8px; color:rgba(255,255,255,0.55);
    text-transform:uppercase; margin-bottom:10px;
  }
  .hero-banner .car-wrap{
    display:flex; justify-content:center; align-items:center; padding:6px 0 10px;
  }
  .hero-banner .car-wrap img{
    width:88%; max-width:420px; height:auto; display:block;
    filter: drop-shadow(0 12px 22px rgba(0,0,0,0.55));
  }
  .hero-banner .model{
    text-align:center; font-size:30px; font-weight:900; letter-spacing:3px; color:#fff;
    text-shadow: 0 2px 10px rgba(0,0,0,0.4);
  }
  .hero-banner .model .brand{
    display:block; font-size:12px; font-weight:700; letter-spacing:3px; color:rgba(255,255,255,0.6);
    margin-bottom:2px;
  }
  .car-badge{
    font-size:20px; font-weight:800; letter-spacing:0.5px;
    background:var(--panel2); border:1px solid var(--line); border-radius:8px;
    padding:6px 12px; color:var(--accent);
  }
  .count-badge{ font-size:13px; color:var(--muted); margin-left:8px; }
  header button{
    background:none; border:1px solid var(--line); color:var(--muted);
    border-radius:8px; padding:8px 12px; font-size:13px; font-weight:600;
  }
  main{ flex:1; padding:14px; padding-bottom: 90px; max-width:640px; margin:0 auto; width:100%; }
  h2.step-title{ font-size:15px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:0.6px; margin:4px 0 12px; }

  /* Car entry screen */
  .entry-wrap{ display:flex; flex-direction:column; gap:14px; margin-top:1vh; }
  .entry-wrap input{
    font-size:26px; text-align:center; letter-spacing:2px; text-transform:uppercase;
    padding:16px; border-radius:12px; border:2px solid var(--line); background:var(--panel2); color:var(--text);
    font-weight:800;
  }
  .entry-wrap input:focus{ outline:none; border-color:var(--accent); }
  .big-btn{
    font-size:18px; font-weight:800; padding:16px; border-radius:12px; border:none;
    background:var(--accent); color:#20180a;
  }
  .recent-cars{ margin-top:6px; }
  .summary-row{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:16px; }
  .mini-card{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:12px; min-height:80px;
  }
  .mini-title{ font-size:12.5px; font-weight:800; margin-bottom:8px; color:var(--text); }
  .mini-subtitle{ font-size:10px; font-weight:800; letter-spacing:0.5px; text-transform:uppercase; margin-bottom:4px; }
  .mini-empty{ font-size:11.5px; color:var(--muted); line-height:1.4; }
  .mini-row{ display:flex; align-items:center; gap:6px; padding:5px 0; border-top:1px solid var(--line); }
  .mini-row:first-of-type{ border-top:none; }
  .mini-row.clickable{ background:none; border:none; border-top:1px solid var(--line); width:100%; text-align:left; font:inherit; color:inherit; cursor:pointer; -webkit-appearance:none; appearance:none; }
  .mini-row.clickable:first-of-type{ border-top:none; }
  .mini-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .mini-row-text{ flex:1; min-width:0; }
  .mini-row-main{ font-size:11.5px; font-weight:700; color:var(--text); line-height:1.3; }
  .mini-row-sub{ font-size:10.5px; color:var(--muted); margin-top:1px; }
  .mini-count{ font-size:12px; font-weight:800; color:var(--accent); }
  .recent-cars .label{ font-size:12px; color:var(--muted); margin-bottom:8px; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    background:var(--panel2); border:1px solid var(--line); color:var(--text);
    padding:8px 14px; border-radius:20px; font-size:14px; font-weight:600;
  }

  /* Zone grid */
  .checklist-btn{
    width:100%; display:flex; align-items:center; gap:10px; justify-content:center;
    background:linear-gradient(90deg, rgba(229,72,77,0.14), rgba(229,72,77,0.06));
    border:1.5px solid rgba(229,72,77,0.55); border-radius:12px; padding:14px;
    color:#ffdada; font-size:14.5px; font-weight:800; margin-bottom:16px; position:relative;
  }
  .checklist-btn.has-notes{ border-color:var(--danger); background:rgba(229,72,77,0.22); }
  .checklist-btn .warn-icon{ font-size:17px; }
  .checklist-btn .n{
    position:absolute; top:-7px; right:-7px; background:var(--danger); color:#fff;
    font-size:11px; font-weight:800; border-radius:50%; width:20px; height:20px;
    display:flex; align-items:center; justify-content:center; box-shadow:0 1px 4px rgba(0,0,0,0.4);
  }
  .zone-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .zone-btn{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:0; color:var(--text); font-size:13px; font-weight:700;
    display:flex; flex-direction:column; align-items:stretch; text-align:center;
    overflow:hidden; position:relative;
  }
  .zone-btn img{ width:100%; height:78px; object-fit:cover; object-position:center; display:block; opacity:0.92; }
  .zone-btn .lbl{ padding:8px 6px; }
  .zone-btn .n{
    position:absolute; top:6px; right:6px;
    font-size:11px; font-weight:800; color:#20180a; background:var(--accent);
    border-radius:10px; padding:2px 8px; min-width:18px; box-shadow:0 1px 4px rgba(0,0,0,0.4);
  }
  .zone-btn.has-defects{ border-color:var(--accent); }

  /* Cota screen: image with overlay grid */
  .zone-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .zone-header .zname{ font-size:17px; font-weight:800; }
  .back-link{ color:var(--accent); font-size:14px; font-weight:700; background:none; border:none; padding:6px 0; }

  .cota-stage{
    position:relative; width:100%; border-radius:12px; overflow:hidden;
    border:1px solid var(--line); background:#0a0e13;
  }
  .cota-stage img{ display:block; width:100%; height:auto; }
  .locator-marker{
    position:absolute; width:30px; height:30px; border-radius:50%;
    background:rgba(229,72,77,0.35); border:3px solid #e5484d;
    transform:translate(-50%,-50%); pointer-events:none;
    box-shadow:0 0 0 8px rgba(229,72,77,0.16);
    animation:locatorPulse 1.4s ease-in-out infinite;
  }
  @keyframes locatorPulse{
    0%,100%{ box-shadow:0 0 0 8px rgba(229,72,77,0.16); }
    50%{ box-shadow:0 0 0 14px rgba(229,72,77,0.08); }
  }
  .cota-cell{
    position:absolute; border:1px solid rgba(255,255,255,0.14);
    background:rgba(0,0,0,0.02);
  }
  .cota-cell:active{ background:rgba(255,180,0,0.35); }
  .cota-cell.marked{ background:rgba(255,180,0,0.32); border-color:var(--accent); }
  .cota-cell.suggested{ border-style:dashed; border-width:2px; }
  .cota-cell.guide-point{ border-width:2px; }
  .pin-icon{ font-size:14px; line-height:1; }
  .cota-cell .dot{
    position:absolute; top:2px; right:2px; width:8px; height:8px; border-radius:50%;
    background:var(--accent); display:none;
  }
  .cota-cell.marked .dot{ display:block; }
  .cota-hint{ font-size:12px; color:var(--muted); margin:8px 2px 0; text-align:center; }
  .dept-legend{ display:flex; justify-content:center; gap:16px; margin:8px 0 4px; }
  .dl-item{ font-size:12px; color:var(--muted); font-weight:700; display:flex; align-items:center; gap:5px; }
  .dl-dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }

  /* Defect code modal */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.55); display:flex; align-items:flex-end;
    z-index:50;
  }
  .sheet{
    background:var(--panel); width:100%; border-radius:18px 18px 0 0; padding:18px;
    border-top:1px solid var(--line);
  }
  .sheet h3{ margin:0 0 4px; font-size:16px; }
  .sheet .sub{ color:var(--muted); font-size:13px; margin-bottom:14px; }
  .code-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .code-btn{
    padding:16px 10px; border-radius:12px; border:none; font-weight:800; font-size:15px;
    color:#fff; text-align:left;
  }
  .code-btn .full{ display:block; font-weight:600; font-size:12px; opacity:0.9; margin-top:2px; }
  .cancel-btn{
    margin-top:14px; width:100%; padding:14px; border-radius:12px; border:1px solid var(--line);
    background:none; color:var(--muted); font-weight:700;
  }

  /* Log list */
  .log-section{ margin-top:22px; }
  .log-item{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; margin-bottom:6px; font-size:14px;
  }
  .log-item .meta{ color:var(--muted); font-size:12px; }
  .log-item .del{ background:none; border:none; color:var(--danger); font-size:18px; padding:4px 8px; }
  .empty{ color:var(--muted); font-size:13px; text-align:center; padding:20px 0; }

  footer{
    position:fixed; bottom:0; left:0; right:0; background:var(--panel);
    border-top:1px solid var(--line); padding:10px 14px; display:flex; gap:10px;
    z-index:20;
  }
  footer button{
    flex:1; padding:14px; border-radius:12px; border:none; font-weight:800; font-size:15px;
  }
  .btn-secondary{ background:var(--panel2); color:var(--text); border:1px solid var(--line) !important; }
  .btn-primary{ background:var(--ok); color:#08210f; }
  .hidden{ display:none !important; }
  .toast{
    position:fixed; top:70px; left:50%; transform:translateX(-50%);
    background:var(--accent); color:#20180a; padding:10px 16px; border-radius:14px;
    font-weight:700; font-size:13px; z-index:60; opacity:0; transition:opacity 0.25s;
    pointer-events:none; max-width:85%; white-space:normal; text-align:center; line-height:1.4;
  }
  .toast.show{ opacity:1; }
  .save-dot{
    display:inline-block; width:8px; height:8px; border-radius:50%; margin-left:6px;
    background:var(--muted); vertical-align:middle;
  }
  .save-dot.ok{ background:var(--ok); }
  .save-dot.err{ background:var(--danger); }
  #printArea{ display:none; }
  @media print{
    body > *:not(#printArea){ display:none !important; }
    #printArea{ display:block !important; background:#fff; color:#101c26; }
    @page{ margin: 12mm; }
  }
</style>

<script>
// Todo el guardado vive en Firestore (Google), hablando directamente con
// su API REST mediante fetch() — nada de librerías externas que "importar".
// Esto sí debería funcionar en Netlify, donde no hay restricción de red
// como la que bloqueaba esto dentro de Claude.
// Cambia esto (fecha/hora) cada vez que se publique una versión nueva —
// se ve en pantalla para poder confirmar qué versión está cargada de verdad.
const APP_VERSION = 'v17 (resumen semanal: media por coche, total y por departamento)';

const FS_PROJECT_ID = "calidad-bodyshop";
const FS_API_KEY = "AIzaSyDocLEPP8DWaTvYVyvIEDU2gzd8umwt05E";
const FS_BASE = `https://firestore.googleapis.com/v1/projects/${FS_PROJECT_ID}/databases/(default)/documents`;

function toFsValue(v){
  if(v === null || v === undefined) return { nullValue: null };
  if(typeof v === 'string') return { stringValue: v };
  if(typeof v === 'boolean') return { booleanValue: v };
  if(typeof v === 'number') return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
  if(Array.isArray(v)) return { arrayValue: { values: v.map(toFsValue) } };
  if(typeof v === 'object') return { mapValue: { fields: Object.fromEntries(Object.entries(v).map(([k,val]) => [k, toFsValue(val)])) } };
  return { stringValue: String(v) };
}
function fromFsValue(fv){
  if(!fv) return null;
  if('stringValue' in fv) return fv.stringValue;
  if('booleanValue' in fv) return fv.booleanValue;
  if('integerValue' in fv) return parseInt(fv.integerValue, 10);
  if('doubleValue' in fv) return fv.doubleValue;
  if('nullValue' in fv) return null;
  if('arrayValue' in fv) return (fv.arrayValue.values||[]).map(fromFsValue);
  if('mapValue' in fv){
    const out = {};
    const f = fv.mapValue.fields || {};
    Object.keys(f).forEach(k => out[k] = fromFsValue(f[k]));
    return out;
  }
  return null;
}
function docToObject(doc){
  const out = {};
  const f = doc.fields || {};
  Object.keys(f).forEach(k => out[k] = fromFsValue(f[k]));
  return out;
}

async function fsGetDoc(path){
  const res = await fetch(`${FS_BASE}/${path}?key=${FS_API_KEY}`);
  if(res.status === 404) return null;
  if(!res.ok) throw new Error('Firestore GET ' + res.status);
  return docToObject(await res.json());
}

async function fsSetDoc(path, dataObj){
  const fields = {};
  Object.keys(dataObj).forEach(k => fields[k] = toFsValue(dataObj[k]));
  const maskParams = Object.keys(dataObj).map(k => `updateMask.fieldPaths=${encodeURIComponent(k)}`).join('&');
  const res = await fetch(`${FS_BASE}/${path}?key=${FS_API_KEY}&${maskParams}`, {
    method: 'PATCH',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ fields })
  });
  if(!res.ok) throw new Error('Firestore PATCH ' + res.status);
  return true;
}

async function fsListCollection(coll){
  const res = await fetch(`${FS_BASE}/${coll}?key=${FS_API_KEY}&pageSize=300`);
  if(!res.ok) throw new Error('Firestore LIST ' + res.status);
  const json = await res.json();
  const out = {};
  (json.documents||[]).forEach(d => {
    const id = d.name.split('/').pop();
    out[id] = docToObject(d);
  });
  return out;
}

async function fsDeleteDoc(path){
  const res = await fetch(`${FS_BASE}/${path}?key=${FS_API_KEY}`, { method: 'DELETE' });
  if(!res.ok) throw new Error('Firestore DELETE ' + res.status);
  return true;
}

function genId(){ return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8); }

let toastTimer = null;
function showToast(msg){
  if(toastTimer) clearTimeout(toastTimer);
  $toast.textContent = msg;
  $toast.classList.add('show');
  const dur = Math.min(8000, Math.max(1600, msg.length * 60));
  toastTimer = setTimeout(()=> $toast.classList.remove('show'), dur);
}

// ---------- Caché en memoria + sondeo periódico (nuestra propia "tiempo real") ----------
let metaCache = { streaks:{}, repetitive:{}, guide:[], prevSuggestions:[] };
let metaPollTimer = null;
let carPollTimer = null;

// Cada modelo (B10/B05) vive separado en la nube: coches con prefijo en el id
// del documento, y un documento de meta (guía/rachas/repetitivos) por modelo.
// B10 usa exactamente las mismas rutas de siempre (sin prefijo), para no
// tocar ni un solo dato de lo que ya había. B05 es el único que vive aparte.
function carDocId(car){ return currentModel === 'B10' ? car : `${currentModel}_${car}`; }
function metaDocPath(){ return currentModel === 'B10' ? 'meta/global' : `meta/global_${currentModel}`; }

async function refreshMeta(){
  try{
    const data = await fsGetDoc(metaDocPath());
    metaCache = Object.assign({streaks:{},repetitive:{},guide:[],prevSuggestions:[]}, data || {});
    return true;
  }catch(e){ return false; }
}

function startMetaPolling(){
  if(metaPollTimer) return;
  metaPollTimer = setInterval(async () => {
    const before = JSON.stringify(metaCache);
    const ok = await refreshMeta();
    if(ok && JSON.stringify(metaCache) !== before){
      if(!currentCar && document.getElementById('guideZoneGrid')){ renderGuideZoneScreen(); }
      else if(!currentCar && document.getElementById('summaryCardsWrap')){
        // Solo se actualiza el resumen, sin tocar la casilla del coche ni el buscador
        document.getElementById('summaryCardsWrap').outerHTML = renderSummaryCards(lastAllCarsForHome);
      }
      else if(currentCar && currentZoneId && document.getElementById('cotaStage')){ renderCotaScreen(currentZoneId); }
    }
  }, 6000);
}

async function saveMetaField(field, value){
  metaCache[field] = value; // se ve al instante en este móvil
  try{ await fsSetDoc(metaDocPath(), { [field]: value }); }
  catch(e){ showToast('No se pudo sincronizar con la nube'); }
}

function sigOf(e){ return `${e.zoneId}|${e.cota}|${e.dept}|${e.code}`; }

function loadPrevSuggestions(){ return metaCache.prevSuggestions || []; }
function savePrevSuggestions(list){ saveMetaField('prevSuggestions', list); }
function loadStreaks(){ return metaCache.streaks || {}; }
function saveStreaks(obj){ saveMetaField('streaks', obj); }
function loadRepetitive(){ return metaCache.repetitive || {}; }
function saveRepetitive(obj){ saveMetaField('repetitive', obj); }
function loadGuide(){ return metaCache.guide || []; }
function saveGuide(list){ saveMetaField('guide', list); }
function guidePointAt(zoneId, cota){
  return loadGuide().find(g => g.zoneId === zoneId && g.cota === cota);
}
function toggleGuidePoint(zoneId, cota){
  const list = loadGuide().slice();
  const idx = list.findIndex(g => g.zoneId === zoneId && g.cota === cota);
  if(idx >= 0){ list.splice(idx, 1); }
  else{ list.push({ id: genId(), zoneId, cota }); }
  saveGuide(list);
}
function removeGuidePoint(zoneId, cota){
  saveGuide(loadGuide().filter(g => !(g.zoneId === zoneId && g.cota === cota)));
}

function stopCarPolling(){ if(carPollTimer){ clearInterval(carPollTimer); carPollTimer = null; } }

// Al salir de un coche (cambiarlo o abrir otro), su lista de defectos se
// guarda como "sugerencia" para el siguiente coche nuevo que se audite.
function leaveCarSession(){
  stopCarPolling();
  if(!currentCar) return;
  const uniq = new Map();
  currentEntries.forEach(e => {
    const sig = sigOf(e);
    if(!uniq.has(sig)) uniq.set(sig, { sig, zoneId:e.zoneId, cota:e.cota, dept:e.dept, code:e.code });
  });
  savePrevSuggestions(Array.from(uniq.values()));
}

function confirmRepeatSuggestion(sug, time){
  logDefect(sug.zoneId, sug.cota, sug.code, sug.dept, time);
  suggestionStatus[sug.sig] = 'repetido';
  const streaks = Object.assign({}, loadStreaks());
  streaks[sug.sig] = (streaks[sug.sig] || 0) + 1;
  saveStreaks(streaks);
  if(streaks[sug.sig] >= 3){
    const rep = Object.assign({}, loadRepetitive());
    const zone = ZONES.find(z=>z.id===sug.zoneId);
    rep[sug.sig] = { zoneId:sug.zoneId, zoneName: zone?zone.name:sug.zoneId, cota:sug.cota, dept:sug.dept, code:sug.code, streak: streaks[sug.sig] };
    saveRepetitive(rep);
  }
}

function cancelSuggestion(sug){
  suggestionStatus[sug.sig] = 'anulado';
  const streaks = Object.assign({}, loadStreaks());
  streaks[sug.sig] = 0;
  saveStreaks(streaks);
  const rep = Object.assign({}, loadRepetitive());
  if(rep[sug.sig]){ delete rep[sug.sig]; saveRepetitive(rep); }
}

// ---------- Datos por coche: Firestore vía REST, con sondeo cada pocos segundos ----------
// Cada coche se guarda como "<MODELO>_<código>" para que B10 y B05 no se mezclen.
async function saveCarData(car, entries){

    await fsSetDoc(`cars/${carDocId(car)}`, { entries, model: currentModel, car });
    return true;
  }catch(e){

  }
}

async function saveChecklist(car, text){

    return true;
  }catch(e){
    showToast('No se pudo guardar la observación');
    return false;
  }
}

let auditDateOverrides = {}; // { carCode: ms timestamp } — fecha de auditoría corregida a mano por el admin

async function fetchAllCars(){
  try{
    const data = await fsListCollection('cars');
    const out = {};
    auditDateOverrides = {};
    Object.keys(data).forEach(id => {
      const isB05 = id.indexOf('B05_') === 0;
      const isB10Prefixed = id.indexOf('B10_') === 0; // residuo de un esquema antiguo, mismo coche que el id sin prefijo
      let carCode, matches;
      if(isB05){
        matches = currentModel === 'B05';
        carCode = data[id].car || id.slice(4);
      }else if(isB10Prefixed){
        matches = currentModel === 'B10';
        carCode = data[id].car || id.slice(4);
      }else{
        matches = currentModel === 'B10';
        carCode = id;
      }
      if(!matches) return;
      const entries = data[id].entries || [];
      if(out[carCode]){
        // Mismo coche guardado bajo dos ids distintos: se combinan sin duplicar defectos idénticos.
        const seen = new Set(out[carCode].map(e => e.id));
        entries.forEach(e => { if(!seen.has(e.id)) out[carCode].push(e); });
      }else{
        out[carCode] = entries.slice();
      }
      if(data[id].auditDate) auditDateOverrides[carCode] = Math.max(auditDateOverrides[carCode] || 0, data[id].auditDate);
    });
    return out;
  }catch(e){
    showToast('No se pudo leer el histórico de la nube');
    return {};
  }
}

async function saveAuditDateOverride(car, ms){
  if(!isAdmin()) return false;
  try{
    await fsSetDoc(`cars/${carDocId(car)}`, { auditDate: ms });
    auditDateOverrides[car] = ms;
    return true;
  }catch(e){
    showToast('No se pudo guardar la fecha: ' + ((e && e.message) || e));
    return false;
  }
}

async function deleteCar(car){
  if(!isAdmin()) return false; // por si acaso se llama desde algún otro sitio
  try{
    await fsDeleteDoc(`cars/${carDocId(car)}`);
    showToast(`Coche ${car} borrado`);
    return true;
  }catch(e){
    showToast('No se pudo borrar: ' + ((e && e.message) || e));
    return false;
  }
}

// ---------- Screen: car entry ----------
function computeGlobalTop3(allCars){
  const counts = { carroceria: {}, prensas: {} };
  Object.values(allCars).forEach(entries => {
    entries.forEach(e => {
      if(!counts[e.dept]) return;
      const key = e.zoneId + '|' + e.code;
      if(!counts[e.dept][key]) counts[e.dept][key] = { count:0, cotas:{}, zoneId:e.zoneId, code:e.code };
      counts[e.dept][key].count++;
      counts[e.dept][key].cotas[e.cota] = (counts[e.dept][key].cotas[e.cota] || 0) + 1;
    });
  });
  const top = (obj) => Object.values(obj)
    .sort((a,b) => b.count - a.count)
    .slice(0,3)
    .map(item => {
      const zone = ZONES.find(z=>z.id===item.zoneId);
      const bestCota = Object.entries(item.cotas).sort((a,b)=>b[1]-a[1])[0][0];
      return { zoneId:item.zoneId, zoneName: zone ? zone.name : item.zoneId, code:item.code, count:item.count, cota:bestCota };
    });
  return { carsCount: Object.keys(allCars).length, carroceria: top(counts.carroceria), prensas: top(counts.prensas) };
}

// Pantalla de solo lectura: muestra en qué punto exacto de la silueta cae
// un defecto (usada desde "Defectos repetitivos" y el resumen de fallos).
function renderLocatorScreen(zoneId, cota){
  const zone = ZONES.find(z => z.id === zoneId);
  if(!zone) return;
  const totalCols = zone.cols + 1;
  const totalRows = 7;
  const colPct = 100 / totalCols;
  const rowPct = 100 / totalRows;
  const rowLetter = cota[0];
  const colNum = parseInt(cota.slice(1), 10);
  const r = ROWS_STD.indexOf(rowLetter);

  $main.innerHTML = `
    <div class="zone-header">
      <button class="back-link" id="locBackBtn">‹ Volver</button>
      <div class="zname">${zone.name} · ${cota}</div>
      <div style="width:56px"></div>
    </div>
    <div class="cota-stage">
      <img src="${ZONE_IMAGES[zoneId]}" alt="${zone.name}">
      <div class="locator-marker" style="left:${(colNum*colPct)+(colPct/2)}%; top:${((r+1)*rowPct)+(rowPct/2)}%;"></div>
    </div>
    <div class="cota-hint">Ubicación exacta del defecto (${cota})</div>
  `;
  document.getElementById('locBackBtn').addEventListener('click', renderCarEntry);
}

// Solo los últimos N coches (por fecha), para no diluir el resumen con
// todo el histórico acumulado.
function lastNCars(allCars, n){
  const carDate = (car) => {
    const entries = allCars[car] || [];
    const lastTs = entries.reduce((m,e) => Math.max(m, e.ts||0), 0);
    return auditDateOverrides[car] || lastTs;
  };
  const codes = Object.keys(allCars).sort((a,b) => carDate(b) - carDate(a)).slice(0,n);
  const out = {};
  codes.forEach(c => { out[c] = allCars[c]; });
  return out;
}

    ? `<div class="mini-empty">${emptyMsg}</div>`
    : list.map(item => `
        <button class="mini-row clickable" onclick="renderLocatorScreen('${item.zoneId}','${item.cota}')">
          <div class="mini-row-text">
            <div class="mini-row-main">${item.zoneName} · ${item.code}</div>
            <div class="mini-row-sub">más frecuente en ${item.cota}</div>
          </div>
          <div class="mini-count">${item.count}</div>
          <span style="color:var(--muted); font-size:16px;">›</span>
        </button>
      `).join('');

  const summaryCard = carsCount > 3 ? `
    <div class="mini-card">
      <div class="mini-title" style="display:flex; align-items:center; justify-content:space-between;">
        <span>📊 Resumen fallos</span>

function openEditAuditDateSheet(car, currentMs){
  if(!isAdmin()) return;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  // input datetime-local necesita "YYYY-MM-DDTHH:mm" en hora local
  const d = currentMs ? new Date(currentMs) : new Date();
  const pad = n => String(n).padStart(2,'0');
  const localValue = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  overlay.innerHTML = `
    <div class="sheet">
      <h3>✏️ Fecha de auditoría — ${car}</h3>
      <div class="sub" style="margin-bottom:10px;">Corrige la fecha y hora que se muestra en el histórico para este coche.</div>
      <input type="datetime-local" id="auditDateInput" value="${localValue}" style="width:100%; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--panel2); color:var(--text); font-size:14px; margin-bottom:14px; box-sizing:border-box;">
      <button class="big-btn" id="saveAuditDateBtn">Guardar fecha</button>
      <button class="cancel-btn" id="cancelAuditDateBtn" style="margin-top:10px;">Cancelar</button>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#saveAuditDateBtn').addEventListener('click', async () => {
    const val = overlay.querySelector('#auditDateInput').value;
    if(!val){ showToast('Elige una fecha'); return; }
    const ms = new Date(val).getTime();
    if(isNaN(ms)){ showToast('Fecha no válida'); return; }
    const ok = await saveAuditDateOverride(car, ms);
    document.body.removeChild(overlay);
    if(ok){ showToast('Fecha actualizada'); renderCarEntry(); }
  });
  overlay.querySelector('#cancelAuditDateBtn').addEventListener('click', () => document.body.removeChild(overlay));
  overlay.addEventListener('click', (e) => { if(e.target === overlay) document.body.removeChild(overlay); });
}

// Al abrir un coche suelto, también se mira si quedó una copia fantasma
// bajo el esquema antiguo ("B10_código") y se fusiona sin duplicar.
async function fetchMergedCarDoc(code){
  const primary = await fsGetDoc(`cars/${carDocId(code)}`);
  let entries = (primary && primary.entries) || [];
  let checklist = (primary && primary.checklist) || '';
  if(currentModel === 'B10'){
    try{
      const ghost = await fsGetDoc(`cars/B10_${code}`);
      if(ghost && ghost.entries && ghost.entries.length){
        const seen = new Set(entries.map(e => e.id));
        entries = entries.concat(ghost.entries.filter(e => !seen.has(e.id)));
        if(!checklist && ghost.checklist) checklist = ghost.checklist;
      }
    }catch(e){ /* sin fantasma, o sin conexión: se ignora */ }
  }
  return { entries, checklist };
}

async function selectCar(code){
  if(currentCar && currentCar !== code) leaveCarSession();
  stopCarPolling();
  currentCar = code;
  currentZoneId = null;
  suggestionStatus = {};

  try{
    const data = await fetchMergedCarDoc(code);
    currentEntries = data.entries;
    currentChecklist = data.checklist;
  }catch(e){
    currentEntries = []; currentChecklist = '';
    showToast('Sin conexión con la nube: ' + ((e && e.message) || e));
  }
  currentSuggestions = currentEntries.length === 0 ? loadPrevSuggestions() : [];
  updateHeader();
  renderZoneScreen();

  // Sondeo: si otro móvil cambia algo en este mismo coche, se refleja aquí
  carPollTimer = setInterval(async () => {
    if(currentCar !== code) return;
    try{
      const data = await fetchMergedCarDoc(code);
      const changed = JSON.stringify(data.entries) !== JSON.stringify(currentEntries);
      currentEntries = data.entries;
      currentChecklist = data.checklist;
      if(changed){
        updateHeader();
        if(currentZoneId){ renderCotaScreen(currentZoneId); }
        else{ renderZoneScreen(); }
      }
    }catch(e){ /* se reintenta en el siguiente ciclo */ }
  }, 4000);
}

// ---------- Screen: cota grid for a zone (image + overlay) ----------
function renderCotaScreen(zoneId){
  currentZoneId = zoneId;
  const zone = ZONES.find(z => z.id === zoneId);
  const markedMap = new Map();
  currentEntries.filter(e=>e.zoneId===zoneId).forEach(e => markedMap.set(e.cota, e));

  $main.innerHTML = `
    <div class="zone-header">
      <button class="back-link" id="backBtn">‹ Zonas</button>
      <div class="zname">${zone.name}</div>
      <div style="width:56px"></div>
    </div>
    <div class="cota-stage" id="cotaStage">
      <img src="${ZONE_IMAGES[zoneId]}" alt="${zone.name}">
    </div>
    <div class="cota-hint">Toca la cota exacta del defecto</div>
    <div class="dept-legend">
      ${DEPARTMENTS.map(d => `<span class="dl-item"><span class="dl-dot" style="background:${d.color}"></span>${d.name}</span>`).join('')}
    </div>
    <div class="log-section">
      <h2 class="step-title">Defectos en esta zona</h2>
      <div id="logListZone"></div>
    </div>
  `;
  document.getElementById('backBtn').addEventListener('click', renderZoneScreen);

  const stage = document.getElementById('cotaStage');
  // Grid = (cols+1) columns x 7 rows: the first row/column are the printed
  // number/letter headers already baked into the image, so overlay buttons
  // only go on the remaining data cells.
  const totalCols = zone.cols + 1;
  const totalRows = 7;
  const colPct = 100 / totalCols;
  const rowPct = 100 / totalRows;

  for(let r = 0; r < 6; r++){
    for(let c = 1; c <= zone.cols; c++){
      const cota = ROWS_STD[r] + c;
      const entry = markedMap.get(cota);
      const guidePoint = !entry ? guidePointAt(zoneId, cota) : null;
      const suggestion = (!entry && !guidePoint) ? currentSuggestions.find(s => s.zoneId===zoneId && s.cota===cota && suggestionStatus[s.sig] !== 'anulado') : null;
      const cell = document.createElement('button');
      cell.className = 'cota-cell' + (entry ? ' marked' : '') + (suggestion ? ' suggested' : '') + (guidePoint ? ' guide-point' : '');
      cell.style.left = (c * colPct) + '%';
      cell.style.top = ((r+1) * rowPct) + '%';
      cell.style.width = colPct + '%';
      cell.style.height = rowPct + '%';
      if(entry){
        const dc = deptInfo(entry.dept).color;
        cell.style.borderColor = dc;
        cell.style.background = dc + '52';
        cell.innerHTML = `<span class="dot" style="background:${dc}; display:block;"></span>`;
      }else if(guidePoint){
        cell.style.borderColor = '#111';
        cell.style.background = 'rgba(10,10,10,0.55)';
        cell.innerHTML = `<span class="pin-icon">📌</span>`;
      }else if(suggestion){
        cell.style.borderColor = '#8a97a3';
        cell.style.background = '#8a97a352';
        cell.innerHTML = `<span class="dot" style="background:#8a97a3; display:block;"></span>`;
      }else{
        cell.innerHTML = '<span class="dot"></span>';
      }
      cell.addEventListener('click', () => {
        if(guidePoint){ openGuideDefectSheet(guidePoint); }
        else if(suggestion){ openSuggestionSheet(suggestion); }
        else{ openDefectPicker(zoneId, cota); }
      });
      stage.appendChild(cell);
    }
  }

  renderLog(document.getElementById('logListZone'), zoneId);
}

// ---------- Email summary ----------
// Draws a donut (defect count by department) + horizontal bars (minutes per
// zone, split by department) so the summary isn't just a wall of text.
// Imagen única con los 4 gráficos del resumen semanal: KPIs, dónut por
// departamento, ranking de coches y Pareto de defectos por código.
function buildWeeklyChartsImage(selectedCars, allCars){
  const W = 900, H = 820;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const BG = '#ffffff', PANEL2 = '#f1f5f9', LINE = '#dbe3ea', TEXT = '#101c26', MUTED = '#5b6b78', ACCENT = '#0e9c7c';
  ctx.fillStyle = BG; ctx.fillRect(0,0,W,H);

  // ---- Agregación de datos ----
  let totalDefects = 0, totalTime = 0;
  const countByDept = {}, timeByDept = {}, codeCounts = {}, carCounts = {}, carDates = {};
  selectedCars.forEach(car => {
    const entries = allCars[car] || [];
    totalDefects += entries.length;
    carCounts[car] = entries.length;
    const lastTs = entries.reduce((m,e) => Math.max(m, e.ts||0), 0);
    carDates[car] = (typeof auditDateOverrides !== 'undefined' && auditDateOverrides[car]) || lastTs;
    entries.forEach(e => {
      totalTime += (e.time||0);
      countByDept[e.dept] = (countByDept[e.dept]||0) + 1;
      timeByDept[e.dept] = (timeByDept[e.dept]||0) + (e.time||0);
      const zone = ZONES.find(z=>z.id===e.zoneId);
      // AFINADO: ahora agrupa por código + cota EXACTA + zona (no solo código+zona)
      const key = e.code + ' · ' + e.cota + ' · ' + (zone ? zone.name : e.zoneId);
      if(!codeCounts[key]) codeCounts[key] = { count:0, deptCounts:{} };
      codeCounts[key].count++;
      codeCounts[key].deptCounts[e.dept] = (codeCounts[key].deptCounts[e.dept]||0) + 1;
    });
  });
  const nCars = Math.max(1, selectedCars.length);
  const avgPerCar = Math.round(totalTime / nCars);

  // ---- Título ----
  ctx.fillStyle = TEXT; ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText(`Resumen semanal · ${modelLabel()}`, 28, 24);
  ctx.font = '13px sans-serif'; ctx.fillStyle = MUTED;
  ctx.fillText(`${selectedCars.length} coche${selectedCars.length===1?'':'s'}`, 28, 56);

  // ---- KPI cards ----
  const kpiY = 90, kpiH = 96, kpiGap = 18, kpiW = (W - 56 - kpiGap*2) / 3;
  const kpis = [
    { label:'COCHES', value:String(selectedCars.length), color:ACCENT },
    { label:'DEFECTOS', value:String(totalDefects), color:'#c2410c' },
    { label:'MEDIA POR COCHE', value:`${avgPerCar} min`, color:'#0369a1' },
  ];
  kpis.forEach((k,i) => {
    const x = 28 + i*(kpiW+kpiGap);
    ctx.fillStyle = PANEL2;
    roundRect(ctx, x, kpiY, kpiW, kpiH, 12); ctx.fill();
    ctx.strokeStyle = LINE; ctx.lineWidth = 1;
    roundRect(ctx, x, kpiY, kpiW, kpiH, 12); ctx.stroke();
    ctx.fillStyle = k.color; ctx.font = 'bold 30px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline='alphabetic';
    ctx.fillText(k.value, x + kpiW/2, kpiY + 52);
    ctx.fillStyle = MUTED; ctx.font = 'bold 11px sans-serif';
    ctx.fillText(k.label, x + kpiW/2, kpiY + 76);
  });

  // ---- Dónut por departamento (izquierda) ----
  const donutY = kpiY + kpiH + 70;
  ctx.fillStyle = TEXT; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('Por departamento', 28, donutY - 40);
  const cx = 150, cy = donutY + 90, rOuter = 92, rInner = 56;
  const sum = Object.values(countByDept).reduce((a,b)=>a+b,0) || 1;
  let startAngle = -Math.PI/2;
  DEPARTMENTS.forEach(d => {
    const val = countByDept[d.id] || 0;
    const angle = (val/sum) * Math.PI*2;
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,rOuter,startAngle,startAngle+angle);
    ctx.closePath(); ctx.fillStyle = d.color; ctx.fill();
    startAngle += angle;
  });
  ctx.beginPath(); ctx.arc(cx,cy,rInner,0,Math.PI*2); ctx.fillStyle = BG; ctx.fill();
  ctx.fillStyle = TEXT; ctx.font = 'bold 28px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(String(totalDefects), cx, cy-8);
  ctx.font = '12px sans-serif'; ctx.fillStyle = MUTED;
  ctx.fillText('defectos', cx, cy+16);
  let ly = cy + rOuter + 26;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  DEPARTMENTS.forEach(d => {
    const n = countByDept[d.id] || 0;
    const pct = sum ? Math.round(n/sum*100) : 0;
    const avgDept = Math.round((timeByDept[d.id] || 0) / nCars);
    ctx.fillStyle = d.color; ctx.fillRect(cx - rOuter, ly, 12, 12);
    ctx.fillStyle = TEXT; ctx.font = 'bold 12px sans-serif';
    ctx.fillText(`${d.name} · ${n} (${pct}%)`, cx - rOuter + 18, ly + 10);
    ctx.fillStyle = MUTED; ctx.font = '11px sans-serif';
    ctx.fillText(`${avgDept} min/coche de media`, cx - rOuter + 18, ly + 25);
    ly += 40;
  });

  // ---- Ranking de coches (derecha) ----
  const rankX = 470, rankW = W - 28 - rankX;
  ctx.fillStyle = TEXT; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('Coches (por fecha)', rankX, donutY - 40);
  const rankRows = Object.entries(carCounts).sort((a,b) => (carDates[b[0]]||0) - (carDates[a[0]]||0)).slice(0,8);
  const maxCount = Math.max(1, ...rankRows.map(r=>r[1]));
  const rankBarH = 22, rankGap = 14, rankTop = donutY;
  ctx.font = 'bold 13px sans-serif';
  rankRows.forEach(([car, n], i) => {
    const y = rankTop + i*(rankBarH+rankGap);
    const w = (n / maxCount) * (rankW - 70);
    ctx.fillStyle = MUTED; ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(car, rankX, y + rankBarH/2);
    ctx.fillStyle = ACCENT;
    roundRect(ctx, rankX + 62, y, Math.max(4,w), rankBarH, 5); ctx.fill();
    ctx.fillStyle = TEXT; ctx.textAlign='left';
    ctx.fillText(String(n), rankX + 62 + w + 8, y + rankBarH/2);
  });

  // ---- Pareto de defectos (AFINADO: código + cota exacta + zona, coloreado por departamento) ----
  const paretoY = donutY + Math.max(rOuter*2 + 26 + DEPARTMENTS.length*40, rankRows.length*(rankBarH+rankGap)) + 70;
  ctx.fillStyle = TEXT; ctx.font = 'bold 15px sans-serif'; ctx.textAlign='left';
  ctx.fillText('Pareto de defectos (ubicación exacta)', 28, paretoY - 30);
  const paretoItems = Object.entries(codeCounts).sort((a,b)=>b[1].count-a[1].count).slice(0,8);
  const totalCodeCount = paretoItems.reduce((s,[,v])=>s+v.count,0) || 1;
  const barAreaX = 28, barAreaW = W - 56, barH = 170, baseY = paretoY + barH;
  const maxVal = Math.max(1, ...paretoItems.map(([,v])=>v.count));
  const bw = barAreaW / paretoItems.length;
  let cum = 0;
  const points = [];
  paretoItems.forEach(([label, v], i) => {
    const n = v.count;
    // Departamento mayoritario de este código+cota+zona exactos
    const majorityDept = Object.entries(v.deptCounts).sort((a,b)=>b[1]-a[1])[0][0];
    const barColor = deptInfo(majorityDept).color;
    const bh = (n / maxVal) * (barH - 20);
    const bx = barAreaX + i*bw + bw*0.18;
    ctx.fillStyle = barColor;
    ctx.fillRect(bx, baseY - bh, bw*0.64, bh);
    ctx.fillStyle = TEXT; ctx.font = 'bold 12px sans-serif'; ctx.textAlign='center';
    ctx.fillText(String(n), bx + bw*0.32, baseY - bh - 8);
    const parts = label.split(' · '); // [code, cota, zoneName]
    ctx.font = 'bold 10px sans-serif'; ctx.fillStyle = TEXT;
    ctx.fillText(`${parts[0]} · ${parts[1]}`, bx + bw*0.32, baseY + 16);
    ctx.font = '8.5px sans-serif'; ctx.fillStyle = MUTED;
    ctx.fillText((parts[2]||'').slice(0,15), bx + bw*0.32, baseY + 29);
    cum += n;
    points.push({ x: bx + bw*0.32, y: baseY - (cum/totalCodeCount) * (barH-20) });
  });
  ctx.strokeStyle = '#c2410c'; ctx.lineWidth = 2; ctx.beginPath();
  points.forEach((p,i) => { if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); });
  ctx.stroke();
  ctx.fillStyle = '#c2410c';
  points.forEach(p => { ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fill(); });

  // Leyenda de color por departamento
  let legX = barAreaX;
  const legY = baseY + 48;
  ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  DEPARTMENTS.forEach(dep => {
    ctx.fillStyle = dep.color;
    ctx.fillRect(legX, legY, 12, 12);
    ctx.fillStyle = MUTED;
    ctx.fillText(dep.name, legX + 18, legY + 11);
    legX += 18 + ctx.measureText(dep.name).width + 24;
  });

  return canvas.toDataURL('image/png');
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function buildSummaryChart(){
  const W = 760, H = 560;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const BG = '#ffffff', TEXT = '#101c26', MUTED = '#5b6b78', SUBTEXT = '#33424c';
  ctx.fillStyle = BG; ctx.fillRect(0,0,W,H);

  ctx.fillStyle = TEXT;
  ctx.font = 'bold 24px sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText(`Resumen · Coche ${currentCar}`, 24, 20);
  ctx.font = '13px sans-serif';
  ctx.fillStyle = MUTED;
  const total = currentEntries.length;
  const totalTime = currentEntries.reduce((s,e)=>s+(e.time||0),0);
  ctx.fillText(`${total} defecto${total===1?'':'s'} · ${totalTime} min totales`, 24, 52);

  // --- Donut: defect count by department ---
  const cx = 150, cy = 210, rOuter = 92, rInner = 56;
  const byDeptCount = {};
  DEPARTMENTS.forEach(d => byDeptCount[d.id] = 0);
  currentEntries.forEach(e => { if(byDeptCount[e.dept] !== undefined) byDeptCount[e.dept]++; });
  let startAngle = -Math.PI/2;
  const sum = Object.values(byDeptCount).reduce((a,b)=>a+b,0) || 1;
  DEPARTMENTS.forEach(d => {
    const val = byDeptCount[d.id];
    const angle = (val/sum) * Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,rOuter,startAngle,startAngle+angle);
    ctx.closePath();
    ctx.fillStyle = d.color;
    ctx.fill();
    startAngle += angle;
  });
  ctx.beginPath(); ctx.arc(cx,cy,rInner,0,Math.PI*2); ctx.fillStyle = BG; ctx.fill();
  ctx.fillStyle = TEXT;
  ctx.font = 'bold 30px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(String(total), cx, cy-8);
  ctx.font = '12px sans-serif'; ctx.fillStyle = MUTED;
  ctx.fillText('defectos', cx, cy+16);

  // legend for donut
  let ly = cy + rOuter + 26;
  ctx.textAlign = 'left'; ctx.font = 'bold 13px sans-serif';
  DEPARTMENTS.forEach(d => {
    ctx.fillStyle = d.color;
    ctx.fillRect(cx - rOuter, ly, 12, 12);
    ctx.fillStyle = TEXT;
    const n = byDeptCount[d.id];
    const t = currentEntries.filter(e=>e.dept===d.id).reduce((s,e)=>s+(e.time||0),0);
    ctx.fillText(`${d.name}: ${n} · ${t} min`, cx - rOuter + 18, ly);
    ly += 22;
  });

  // --- Bar chart: minutes per zone, split by department ---
  const byZoneTime = {};
  currentEntries.forEach(e => {
    if(!byZoneTime[e.zoneId]) byZoneTime[e.zoneId] = {};
    byZoneTime[e.zoneId][e.dept] = (byZoneTime[e.zoneId][e.dept]||0) + (e.time||0);
  });
  const zoneRows = Object.keys(byZoneTime).map(zid => {
    const zone = ZONES.find(z=>z.id===zid);
    const parts = byZoneTime[zid];
    const t = Object.values(parts).reduce((a,b)=>a+b,0);
    return { name: zone ? zone.name : zid, parts, total: t };
  }).sort((a,b) => b.total - a.total);

  const chartX = 330, chartW = 400, rowH = 30, chartTop = 108;
  const maxT = Math.max(1, ...zoneRows.map(r=>r.total));
  ctx.font = 'bold 14px sans-serif'; ctx.fillStyle = TEXT; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillText('Minutos por zona', chartX, chartTop - 14);
  zoneRows.slice(0, 12).forEach((row, i) => {
    const y = chartTop + i*rowH;
    ctx.font = '12px sans-serif'; ctx.fillStyle = SUBTEXT;
    ctx.fillText(row.name, chartX, y + 14);
    let bx = chartX;
    const by = y + 18, bh = 10;
    const barMaxW = chartW;
    DEPARTMENTS.forEach(d => {
      const v = row.parts[d.id] || 0;
      const w = (v / maxT) * barMaxW;
      if(w > 0){
        ctx.fillStyle = d.color;
        ctx.fillRect(bx, by, w, bh);
        bx += w;
      }
    });
    ctx.fillStyle = MUTED; ctx.font = '11px sans-serif';
    ctx.fillText(`${row.total} min`, bx + 6, by + 9);
  });

  return canvas.toDataURL('image/png');
}

// Draws the zone's real photo with a red marker + code at each logged
// defect's exact cota, so the summary can show "where" visually, not just text.
function buildAnnotatedImage(zoneId){
  return new Promise((resolve) => {
    const zone = ZONES.find(z => z.id === zoneId);
    const entries = currentEntries.filter(e => e.zoneId === zoneId);
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const totalCols = zone.cols + 1;
      const totalRows = 7;
      const r = Math.max(canvas.width, canvas.height) * 0.022;
      entries.forEach(e => {
        const rowIdx = ROWS_STD.indexOf(e.cota[0]);
        const colIdx = parseInt(e.cota.slice(1), 10);
        const cx = (colIdx + 0.5) / totalCols * canvas.width;
        const cy = (rowIdx + 1 + 0.5) / totalRows * canvas.height;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI*2);
        ctx.fillStyle = deptInfo(e.dept).color;
        ctx.fill();
        ctx.lineWidth = Math.max(2, r*0.18); ctx.strokeStyle = '#fff'; ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold ' + Math.round(r*1.15) + 'px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(e.code, cx, cy + r*1.9);
      });
      resolve({ zoneId, name: zone.name, dataUrl: canvas.toDataURL('image/png') });
    };
    img.onerror = () => resolve(null);
    img.src = ZONE_IMAGES[zoneId];
  });
}

// Miniatura de una zona con un único punto rojo marcado en la cota exacta —
// se usa en los informes imprimibles (defectos repetitivos / TOP 3).
function buildLocatorThumb(zoneId, cota){
  return new Promise((resolve) => {
    const zone = ZONES.find(z => z.id === zoneId);
    if(!zone){ resolve(null); return; }
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const totalCols = zone.cols + 1;
      const totalRows = 7;
      const rowIdx = ROWS_STD.indexOf(cota[0]);
      const colIdx = parseInt(cota.slice(1), 10);
      const cx = (colIdx + 0.5) / totalCols * canvas.width;
      const cy = (rowIdx + 1 + 0.5) / totalRows * canvas.height;
      const r = Math.max(canvas.width, canvas.height) * 0.045;
      ctx.beginPath(); ctx.arc(cx, cy, r*1.6, 0, Math.PI*2);
      ctx.strokeStyle = '#e5484d'; ctx.lineWidth = r*0.32; ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
      ctx.fillStyle = '#e5484d'; ctx.fill();
      resolve(canvas.toDataURL('image/png'));
    };
    img.onerror = () => resolve(null);
    img.src = ZONE_IMAGES[zoneId];
  });
}

function dataUrlToFile(dataUrl, filename){
  const [meta, b64] = dataUrl.split(',');
  const mime = meta.match(/:(.*?);/)[1];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0; i<bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new File([arr], filename, { type: mime });
}

    });
    Object.keys(byUser).forEach(u => {
      body += `${u}\n`;
      byUser[u].forEach(e => {
        const zone = ZONES.find(z=>z.id===e.zoneId);
        body += `${zone ? zone.name : e.zoneId}: ${e.cota} ${e.code}${e.dept ? ' (' + deptInfo(e.dept).name + ')' : ''}${e.time ? ', ' + e.time + ' min' : ''}\n`;
      });
      body += '\n';
    });
    body += `Total: ${total} defectos · ${totalTime} min.`;
    DEPARTMENTS.forEach(d => {
      if(timeByDept[d.id]){
        const n = currentEntries.filter(e=>e.dept===d.id).length;
        body += `\n· ${d.name}: ${n} defecto${n===1?'':'s'}, ${timeByDept[d.id]} min`;
      }
    });
  }else{
    body += `El coche ${currentCar} no tiene defectos registrados en la cuadrícula.`;
  }
  if(currentChecklist.trim()){
    body += `\n\n⚠️ OBSERVACIONES CHECKLIST:\n${currentChecklist.trim()}`;
  }

  const subject = `Defectos coche ${currentCar}`;
  const mailto = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  const inIframe = (() => { try{ return window.self !== window.top; }catch(e){ return true; } })();
  const canShare = !!(navigator.share) && !inIframe;

  showToast('Generando imágenes…');
  const zoneImages = (await Promise.all(Object.keys(byZone).map(buildAnnotatedImage))).filter(Boolean);
  const images = total > 0
    ? [{ zoneId:'_summary', name:'Resumen (gráfico)', dataUrl: buildSummaryChart() }, ...zoneImages]
    : zoneImages;

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="sheet" style="max-height:85vh; overflow-y:auto;">
      <h3>Enviar defectos de ${currentCar}</h3>
      <div class="sub">${total > 0 ? `${total} defecto${total===1?'':'s'} en ${zoneCount} zona${zoneCount===1?'':'s'}` : ''}${total > 0 && currentChecklist.trim() ? ' · ' : ''}${currentChecklist.trim() ? '⚠️ con observaciones checklist' : ''}</div>
      <a href="${mailto}" id="mailLink" style="display:block; text-align:center; padding:16px; border-radius:12px; background:var(--ok); color:#08210f; text-decoration:none; font-weight:800; font-size:16px; margin-bottom:10px;">Abrir email</a>
      ${canShare ? `<button class="cancel-btn" id="shareBtn" style="margin-bottom:10px;">Compartir (texto + imágenes)</button>` : ''}
      <button class="cancel-btn" id="copyBtn" style="margin-bottom:10px;">Copiar resumen</button>
      <textarea id="summaryText" readonly style="width:100%; height:110px; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:8px; font-size:12px; margin-bottom:10px;">${subject}\n\n${body}</textarea>
      <div class="sub" style="margin-bottom:8px;">Imágenes con los defectos marcados:</div>
      <div id="imgList" style="display:flex; flex-direction:column; gap:10px; margin-bottom:10px;"></div>
      <div class="sub" style="margin-bottom:10px;">"Abrir email" solo lleva el texto (un enlace de correo no puede adjuntar imágenes).${canShare ? ' Para mandar texto + imágenes juntos, usa "Compartir".' : ' Aquí dentro de Claude no se puede compartir texto+imágenes en un solo toque (restricción del propio navegador) — descarga cada imagen con "Descargar" y adjúntala a mano en el email o el chat que uses.'}</div>
      ${!canShare && inIframe ? `<div class="sub" style="margin-bottom:10px; opacity:0.75;">Si quieres el envío en un solo toque, esta misma app funciona así fuera de Claude (por ejemplo subida a Netlify).</div>` : ''}
      <button class="cancel-btn" id="closeSheet">Cerrar</button>
    </div>
  `;
  document.body.appendChild(overlay);

  const imgList = overlay.querySelector('#imgList');
  images.forEach(im => {
    const row = document.createElement('div');
    row.style.cssText = 'border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--panel2);';
    row.innerHTML = `
      <img src="${im.dataUrl}" style="width:100%; display:block;" alt="${im.name}">
      <div style="display:flex; align-items:center; justify-content:space-between; padding:8px 10px;">
        <span style="font-size:12.5px; font-weight:700;">${im.name}</span>
        <a href="${im.dataUrl}" download="${currentCar}_${im.zoneId}.png" style="color:var(--accent); font-size:12.5px; font-weight:700; text-decoration:none;">Descargar</a>
      </div>
    `;
    imgList.appendChild(row);
  });

  if(canShare){
    overlay.querySelector('#shareBtn').addEventListener('click', async () => {
      showToast('Preparando para compartir…');
      let files;
      try{
        files = images.map(im => dataUrlToFile(im.dataUrl, `${currentCar}_${im.zoneId}.png`));
      }catch(e){
        showToast('Error preparando las imágenes: ' + ((e && e.message) || e));
        return;
      }
      const withFiles = { title: subject, text: subject + '\n\n' + body, files };
      const textOnly = { title: subject, text: subject + '\n\n' + body };
      try{
        const canShareFiles = !!(navigator.canShare && navigator.canShare(withFiles));
        if(canShareFiles){
          await navigator.share(withFiles);
        }else{
          showToast('Este navegador no admite compartir imágenes aquí, solo texto');
          await navigator.share(textOnly);
        }
      }catch(e){
        if(e && e.name === 'AbortError') return; // el usuario canceló, no es un fallo
        showToast('Fallo al compartir (' + (e && e.name) + '): ' + ((e && e.message) || e));
      }
    });
  }
  overlay.querySelector('#copyBtn').addEventListener('click', () => {
    const ta = overlay.querySelector('#summaryText');
    ta.focus(); ta.select();
    let copied = false;
    try{ copied = document.execCommand('copy'); }catch(e){ copied = false; }
    if(copied){ showToast('Resumen copiado'); return; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(subject + '\n\n' + body)
        .then(() => showToast('Resumen copiado'))
        .catch(() => showToast('No se pudo copiar automáticamente, selecciona el texto a mano'));
    }else{
      showToast('Selecciona el texto de arriba y cópialo a mano');
    }
  });
  overlay.querySelector('#mailLink').addEventListener('click', () => {
    setTimeout(() => { if(document.body.contains(overlay)) document.body.removeChild(overlay); }, 300);
  });
  overlay.querySelector('#closeSheet').addEventListener('click', () => document.body.removeChild(overlay));
  overlay.addEventListener('click', (e) => { if(e.target === overlay) document.body.removeChild(overlay); });
}

// ---------- Resumen semanal (varios coches elegidos a mano) ----------
function renderWeeklySummaryPicker(){
  const allCars = lastAllCarsForHome;
  const carCodes = Object.keys(allCars).sort();

  const zoneOptions = ZONES.map(z => `<option value="${z.id}">${z.name}</option>`).join('');

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="sheet" style="max-height:85vh; overflow-y:auto;">
      <h3>Resumen semanal — ${modelLabel()}</h3>
      <div class="sub" style="margin-bottom:6px;">¿Qué parte quieres analizar?</div>
      <select id="zoneFilterSelect" style="width:100%; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--panel2); color:var(--text); font-size:14px; margin-bottom:14px; box-sizing:border-box;">
        <option value="" selected disabled>-- Elige una opción --</option>
        <option value="ALL">Todas las zonas (general)</option>
        ${zoneOptions}
      </select>
      <div class="sub" style="margin-bottom:10px;">Elige los coches que quieres incluir.</div>
      <button class="cancel-btn" id="selAllBtn" style="margin-bottom:10px;">Marcar/desmarcar todos</button>
      <div id="carCheckList" style="display:flex; flex-direction:column; gap:6px; margin-bottom:14px; max-height:42vh; overflow-y:auto;"></div>
      <button class="big-btn" id="genSummaryBtn" disabled style="opacity:0.4;">Generar resumen</button>
      <button class="cancel-btn" id="closeWeeklyPicker" style="margin-top:10px;">Cancelar</button>
    </div>
  `;
  document.body.appendChild(overlay);

  const listEl = overlay.querySelector('#carCheckList');
  if(carCodes.length === 0){
    listEl.innerHTML = `<div class="mini-empty">No hay coches auditados todavía.</div>`;
  }else{
    carCodes.forEach(c => {
      const n = (allCars[c] || []).length;
      const row = document.createElement('label');
      row.style.cssText = 'display:flex; align-items:center; gap:8px; padding:9px 10px; border:1px solid var(--line); border-radius:10px; cursor:pointer;';
      row.innerHTML = `<input type="checkbox" class="carCheck" value="${c}" checked style="width:18px; height:18px; flex-shrink:0;"><span style="flex:1; font-weight:700;">${c}</span><span class="meta">${n} defecto${n===1?'':'s'}</span>`;
      listEl.appendChild(row);
    });
  }

  const zoneSelect = overlay.querySelector('#zoneFilterSelect');
  const genBtn = overlay.querySelector('#genSummaryBtn');
  zoneSelect.addEventListener('change', () => {
    const chosen = !!zoneSelect.value;
    genBtn.disabled = !chosen;
    genBtn.style.opacity = chosen ? '1' : '0.4';
  });

  let allChecked = true;
  overlay.querySelector('#selAllBtn').addEventListener('click', () => {
    allChecked = !allChecked;
    overlay.querySelectorAll('.carCheck').forEach(cb => cb.checked = allChecked);
  });
  overlay.querySelector('#closeWeeklyPicker').addEventListener('click', () => document.body.removeChild(overlay));
  overlay.addEventListener('click', (e) => { if(e.target === overlay) document.body.removeChild(overlay); });
  genBtn.addEventListener('click', () => {
    if(!zoneSelect.value) return; // por si acaso, el botón ya está deshabilitado
    const selected = Array.from(overlay.querySelectorAll('.carCheck:checked')).map(cb => cb.value);
    if(selected.length === 0){ showToast('Elige al menos un coche'); return; }
    document.body.removeChild(overlay);
    showWeeklySummarySheet(selected, allCars, zoneSelect.value);
  });
}

function showWeeklySummarySheet(selectedCars, allCars, zoneFilter){
  zoneFilter = zoneFilter || 'ALL';
  const filterZone = ZONES.find(z => z.id === zoneFilter);
  let totalDefects = 0, totalTime = 0;
  const timeByDept = {}, countByDept = {}, codeCounts = {};
  const perCarLines = [];

  selectedCars.forEach(car => {
    const allEntries = allCars[car] || [];
    const entries = zoneFilter === 'ALL' ? allEntries : allEntries.filter(e => e.zoneId === zoneFilter);
    totalDefects += entries.length;
    const carTime = entries.reduce((s,e) => s + (e.time||0), 0);
    totalTime += carTime;
    entries.forEach(e => {
      timeByDept[e.dept] = (timeByDept[e.dept]||0) + (e.time||0);
      countByDept[e.dept] = (countByDept[e.dept]||0) + 1;
      const zone = ZONES.find(z=>z.id===e.zoneId);
      const key = (zone ? zone.name : e.zoneId) + ' · ' + e.code;
      codeCounts[key] = (codeCounts[key]||0) + 1;
    });
    perCarLines.push(`· ${car}: ${entries.length} defecto${entries.length===1?'':'s'}${carTime ? ', ' + carTime + ' min' : ''}`);
  });

  const topCodes = Object.entries(codeCounts).sort((a,b) => b[1]-a[1]).slice(0,8);
  const modelName = modelLabel();
  const scopeLabel = zoneFilter === 'ALL' ? 'todas las zonas' : (filterZone ? filterZone.name : zoneFilter);
  const subject = `Resumen semanal ${modelName} · ${scopeLabel} · ${selectedCars.length} coche${selectedCars.length===1?'':'s'}`;
  const nCarsForAvg = Math.max(1, selectedCars.length);
  const avgPerCar = Math.round(totalTime / nCarsForAvg);

  let body = `Resumen ${modelName} · ${scopeLabel} · ${selectedCars.length} coche${selectedCars.length===1?'':'s'} · ${totalDefects} defecto${totalDefects===1?'':'s'} en total`;
  if(totalTime) body += ` · Media por coche: ${avgPerCar} min`;
  body += `\n\nPor departamento:\n`;
  DEPARTMENTS.forEach(d => {
    if(countByDept[d.id]){
      const avgDept = Math.round((timeByDept[d.id]||0) / nCarsForAvg);
      body += `· ${d.name}: ${countByDept[d.id]} defecto${countByDept[d.id]===1?'':'s'}, media ${avgDept} min/coche\n`;
    }
  });
  if(topCodes.length){
    body += `\nDefectos más frecuentes:\n`;
    topCodes.forEach(([k,n]) => { body += `· ${k}: ${n}\n`; });
  }
  body += `\nPor coche:\n${perCarLines.join('\n')}`;

  const filteredAllCars = {};
  selectedCars.forEach(car => {
    const allEntries = allCars[car] || [];
    filteredAllCars[car] = zoneFilter === 'ALL' ? allEntries : allEntries.filter(e => e.zoneId === zoneFilter);
  });
  const chartDataUrl = buildWeeklyChartsImage(selectedCars, filteredAllCars, scopeLabel);

  const mailto = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  const inIframe = (() => { try{ return window.self !== window.top; }catch(e){ return true; } })();
  const canShare = !!(navigator.share) && !inIframe;

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="sheet" style="max-height:85vh; overflow-y:auto;">
      <h3>${subject}</h3>
      <img src="${chartDataUrl}" alt="Gráficos del resumen semanal" style="width:100%; border-radius:12px; border:1px solid var(--line); margin-bottom:10px;">
      <a href="${chartDataUrl}" download="resumen_${modelName}_${selectedCars.length}coches.png" class="cancel-btn" style="display:block; text-align:center; text-decoration:none; margin-bottom:10px;">Descargar gráficos</a>
      <a href="${mailto}" id="weeklyMailLink" style="display:block; text-align:center; padding:16px; border-radius:12px; background:var(--ok); color:#08210f; text-decoration:none; font-weight:800; font-size:16px; margin-bottom:10px;">Abrir email (solo texto)</a>
      ${canShare ? `<button class="cancel-btn" id="shareWeeklyBtn" style="margin-bottom:10px;">Compartir (texto + gráficos)</button>` : ''}
      <button class="cancel-btn" id="copyWeeklyBtn" style="margin-bottom:10px;">Copiar resumen (texto)</button>
      <textarea id="weeklyText" readonly style="width:100%; height:220px; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:8px; font-size:12px; margin-bottom:10px;">${subject}\n\n${body}</textarea>
      <button class="cancel-btn" id="closeWeeklySheet">Cerrar</button>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.querySelector('#copyWeeklyBtn').addEventListener('click', () => {
    const ta = overlay.querySelector('#weeklyText');
    ta.focus(); ta.select();
    let copied = false;
    try{ copied = document.execCommand('copy'); }catch(e){ copied = false; }
    if(copied){ showToast('Resumen copiado'); return; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(subject + '\n\n' + body)
        .then(() => showToast('Resumen copiado'))
        .catch(() => showToast('No se pudo copiar automáticamente, selecciona el texto a mano'));
    }else{
      showToast('Selecciona el texto de arriba y cópialo a mano');
    }
  });
  overlay.querySelector('#weeklyMailLink').addEventListener('click', () => {
    setTimeout(() => { if(document.body.contains(overlay)) document.body.removeChild(overlay); }, 300);
  });
  if(canShare){
    overlay.querySelector('#shareWeeklyBtn').addEventListener('click', async () => {
      showToast('Preparando para compartir…');
      try{
        const file = dataUrlToFile(chartDataUrl, `resumen_${modelName}_${selectedCars.length}coches.png`);
        const withFile = { title: subject, text: subject + '\n\n' + body, files: [file] };
        const canShareFile = !!(navigator.canShare && navigator.canShare(withFile));
        if(canShareFile){
          await navigator.share(withFile);
        }else{
          showToast('Este navegador no admite compartir imágenes aquí, solo texto');
          await navigator.share({ title: subject, text: subject + '\n\n' + body });
        }
      }catch(e){
        if(e && e.name === 'AbortError') return;
        showToast('Fallo al compartir (' + (e && e.name) + '): ' + ((e && e.message) || e));
      }
    });
  }
  overlay.querySelector('#closeWeeklySheet').addEventListener('click', () => document.body.removeChild(overlay));
  overlay.addEventListener('click', (e) => { if(e.target === overlay) document.body.removeChild(overlay); });
}

// ---------- Login: nombre + PIN de 4 dígitos ----------
function modelHeroImage(){ return currentModel === 'B05' ? MODEL_IMAGE_B05 : MODEL_IMAGE_B10; }
function modelLabel(){ return currentModel; }

function renderModelSelectScreen(){
  currentCar = null;
  $main.innerHTML = `
    <div class="entry-wrap" style="margin-top:10px;">
      <h2 class="step-title">¿Qué modelo vas a auditar?</h2>
      <div style="display:flex; gap:14px; margin-top:10px;">
        <button id="pickB10" style="flex:1; padding:0; border:2px solid var(--line); border-radius:16px; overflow:hidden; background:var(--panel2); cursor:pointer;">
          <img src="${MODEL_IMAGE_B10}" alt="B10" style="width:100%; display:block;">
        </button>
        <button id="pickB05" style="flex:1; padding:0; border:2px solid var(--line); border-radius:16px; overflow:hidden; background:var(--panel2); cursor:pointer;">
          <img src="${MODEL_IMAGE_B05}" alt="B05" style="width:100%; display:block;">
        </button>
      </div>
      <div class="cota-hint" style="text-align:center; margin-top:14px;">Cada modelo tiene su propio historial de coches.</div>
    </div>
  `;
  const pick = (model) => {
    currentModel = model;
    if(currentUser){ renderCarEntry(); } else { renderLoginScreen(); }
  };
  document.getElementById('pickB10').addEventListener('click', () => pick('B10'));
  document.getElementById('pickB05').addEventListener('click', () => pick('B05'));
}

function renderLoginScreen(){
  $main.innerHTML = `
    <div class="hero-banner">
      <div class="eyebrow">Control de calidad</div>
      <div class="qc-line">Identifícate para empezar</div>
      <div class="car-wrap"><img src="${modelHeroImage()}" alt="LeapMotor ${modelLabel()}"></div>
      <div class="model"><span class="brand">LEAPMOTOR</span>${modelLabel()}</div>
    </div>
    <div class="entry-wrap">
      <h2 class="step-title">¿Quién eres?</h2>
      <input id="loginName" type="text" placeholder="Tu nombre" autocomplete="off" style="font-size:20px; text-align:center; padding:14px; border-radius:12px; border:2px solid var(--line); background:var(--panel2); color:var(--text); font-weight:700;">
      <input id="loginPin" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="PIN (4 dígitos)" autocomplete="off" style="font-size:22px; text-align:center; letter-spacing:8px; padding:14px; border-radius:12px; border:2px solid var(--line); background:var(--panel2); color:var(--text); font-weight:800;">
      <button class="big-btn" id="loginBtn">Entrar</button>
      <div class="cota-hint">El nombre y PIN quedan asociados a los defectos que registres, para saber quién hizo qué.</div>
    </div>
  `;
  const nameInput = document.getElementById('loginName');
  const pinInput = document.getElementById('loginPin');
  pinInput.addEventListener('input', () => { pinInput.value = pinInput.value.replace(/\D/g,'').slice(0,4); });
  nameInput.focus();
  const tryLogin = () => {
    const name = nameInput.value.trim();
    const pin = pinInput.value.trim();
    if(!name){ showToast('Escribe tu nombre'); nameInput.focus(); return; }
    if(pin.length !== 4){ showToast('El PIN debe tener 4 dígitos'); pinInput.focus(); return; }
    currentUser = { name, pin };
    renderCarEntry();
  };
  document.getElementById('loginBtn').addEventListener('click', tryLogin);
  pinInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') tryLogin(); });
}

function logoutUser(){
  currentUser = null;
  leaveCarSession();
  currentCar = null;
  renderLoginScreen();
}

// ---------- Init ----------
const $versionStamp = document.getElementById('versionStamp');
if($versionStamp) $versionStamp.textContent = APP_VERSION;
renderModelSelectScreen();
</script>
